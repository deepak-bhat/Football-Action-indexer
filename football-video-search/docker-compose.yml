version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SQLITE_DB_PATH=/data/football.db
      - VIDEO_BASE_DIR=/videos
      - WHISPER_MODEL_SIZE=medium
      - WHISPER_DEVICE=cpu
    volumes:
      - ./data:/data
      - ${VIDEO_DIR:-./videos}:/videos
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
